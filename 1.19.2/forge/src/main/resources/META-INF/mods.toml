modLoader = "javafml"
# Forge 1.19.2 starts at version 43
loaderVersion = "[43,)"
issueTrackerURL = "https://github.com/Rockiecraft/Create-More-Farmables/issues"
license = "MIT"

[[mods]]
modId = "create_more_farmables"
version = "${version}"
displayURL = "https://modrinth.com/mod/create-more-farmables"
displayName = "Create: More Farmables"
authors = "RockieFT or Rockiecraft"
logoFile = "logo.png"
description = '''
A Create Addon that brings full automation to More Items, More Blocks, More Fluids, More Mods
'''

[[dependencies.create_more_farmables]]
modId = "forge"
mandatory = true
versionRange = "[43,)" # Minimum for 1.19.2
ordering = "NONE"
side = "BOTH"

[[dependencies.create_more_farmables]]
modId = "minecraft"
mandatory = true
versionRange = "[1.19.2,1.19.3)" # Specific to 1.19.2
ordering = "NONE"
side = "BOTH"

[[dependencies.create_more_farmables]]
modId = "architectury"
mandatory = true
versionRange = "[6.5.97,)" # Standard stable for 1.19.2
ordering = "AFTER"
side = "BOTH"

[[dependencies.create_more_farmables]]
modId = "botarium"
mandatory = true
versionRange = "[1.9.2,)" # Last stable 1.19.2 version
ordering = "AFTER"
side = "BOTH"

[[dependencies.create_more_farmables]]
modId = "resourcefullib"
mandatory = true
versionRange = "[1.1.24,)" # Version compatible with 1.19.2
ordering = "NONE"
side = "BOTH"

[[dependencies.create_more_farmables]]
modId = "create"
