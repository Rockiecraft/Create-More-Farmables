name: Manual Mod Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Mod Version (e.g., 0.9.0)'
        required: true
        default: '0.9.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Extract Changelog Section
        id: extract_changelog
        run: |
          VERSION="${{ github.event.inputs.version }}"
          # This finds the line starting with "## " + your version
          # and extracts everything until it hits a line that is exactly "---"
          sed -n "/^## $VERSION/,/^---/p" changelog.md | sed '$d' > release_notes.md
          echo "Notes extracted to release_notes.md"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Grabs only the specific combo/universal jars from the root build folder
          gh release create "v${{ github.event.inputs.version }}" \
            github_build/libs/*.jar \
            --repo="$GITHUB_REPOSITORY" \
            --title="Release v${{ github.event.inputs.version }}" \
            --notes-file release_notes.md
