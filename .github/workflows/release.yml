name: Manual Mod Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Mod Version (e.g., 0.9.0)'
        required: true
        default: '0.9.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Merge Jars
        run: ./gradlew :1.19.2:assemble :1.20.1:assemble :1.19.2:mergeJars :1.20.1:mergeJars --no-daemon

      - name: Extract Changelog Section
        id: extract_changelog
        run: |
          VERSION="${{ github.event.inputs.version }}"
          sed -n "/^## $VERSION/,/^---/p" changelog.md | sed '$d' > release_notes.md
          echo "Notes extracted to release_notes.md"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.event.inputs.version }}" \
            1.19.2/build/forgix/*.jar \
            1.20.1/build/forgix/*.jar \
            1.19.2/*/build/libs/*.jar \
            1.20.1/*/build/libs/*.jar \
            --repo="$GITHUB_REPOSITORY" \
            --title="Release v${{ github.event.inputs.version }}" \
            --notes-file release_notes.md
