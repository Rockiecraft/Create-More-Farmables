architectury {
    common rootProject.enabled_platforms.split(',')
}

repositories {
    maven {
        url = "https://maven.resourcefulbees.com"
    }
    maven {
        name = "tterrag maven"
        url = "https://maven.tterrag.com/"
    }
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"
    modImplementation "com.teamresourceful.resourcefullib:resourcefullib-common-1.19.2:${rootProject.resourcefullib_version}"
    modImplementation "com.teamresourceful.resourcefulconfig:resourcefulconfig-common-1.19.2:${resourceful_config_version}"

    // Create - compile-only here; forge/build.gradle and fabric/build.gradle each add their own
    // real (loader-specific) runtime dependency below. See DyeSplashingRecipeType and
    // DyeSplashingFanProcessingType for what this is used for.
    modCompileOnly("com.simibubi.create:create-${rootProject.minecraft_version}:${rootProject.create_forge_version}:slim") { transitive = false }

}

processResources {
    inputs.property "resourcefullib_version", rootProject.resourcefullib_version
}

