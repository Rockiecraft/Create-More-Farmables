plugins {
    id 'com.gradleup.shadow'
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {

    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"


    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')


    modImplementation "com.teamresourceful.resourcefullib:resourcefullib-fabric-1.20.1:${resourcefulLibVersion}"
    modImplementation "com.teamresourceful.resourcefulconfig:resourcefulconfig-fabric-1.20.1:2.1.3"
    modImplementation "com.terraformersmc:modmenu:$rootProject.modmenu_version"

    implementation project(':common')


    // https://modrinth.com/mod/create-fabric/versions?l=fabric&g=1.20.1
    modImplementation "maven.modrinth:create-fabric:${rootProject.create_fabric_version}"
    modImplementation "dev.engine-room.flywheel:flywheel-fabric-${minecraft_version}:${flywheel_version}"


    // https://mvn.devos.one/#/snapshots/com/tterrag/registrate_fabric/Registrate
    modImplementation "com.tterrag.registrate_fabric:Registrate:${rootProject.registrate_fabric_version}"

    // https://maven.createmod.net/net/createmod/catnip/Catnip-Fabric-1.20.1/
    modImplementation "net.createmod.catnip:Catnip-Fabric-${minecraft_version}:${catnip_fabric_version}"

    // JEI
    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
    filesMatching("fabric.mod.json") { expand "version": project.version }
    filesMatching("META-INF/mods.toml") { expand "version": project.version }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
fabricApi {
    configureDataGeneration()
}