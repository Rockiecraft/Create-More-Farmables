plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

repositories {

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }


    maven {
        name = "DevOS Snapshots" // Registrate Fabric, Porting Lib, Milk Lib
        url = "https://mvn.devos.one/snapshots/"
    }
    maven {
        name = "Jitpack" // Porting Lib's own subdeps: Mixin Extras, Fabric ASM
        url = "https://jitpack.io/"
    }
    maven {
        name = "Tterrag" // Flywheel (Fabric build, old com.jozufozu.flywheel coordinate)
        url = "https://maven.tterrag.com/"
    }
    maven {
        name = "Fuzss Mod Resources" // Forge Config API Port (old net.minecraftforge coordinate)
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven"
    }
    maven {
        name = "Jamie Swhiteshirt" // Reach Entity Attributes
        url = "https://maven.jamieswhiteshirt.com/libs-release"
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modApi "com.terraformersmc:modmenu:$rootProject.modmenu_version"
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    modImplementation "com.teamresourceful.resourcefulconfig:resourcefulconfig-fabric-1.19.2:${resourceful_config_version}"
    modApi "com.teamresourceful.resourcefullib:resourcefullib-fabric-1.19.2:${resourcefullib_version}"

    modCompileOnly "mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}"
    modCompileOnly "mezz.jei:jei-${rootProject.minecraft_version}-fabric-api:${rootProject.jei_version}"
    modLocalRuntime "mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}"

    modImplementation "maven.modrinth:create-fabric:${rootProject.create_fabric_version}"

    for (String module in "${rootProject.port_lib_modules}".split(",")) {
        modImplementation "io.github.fabricators_of_create.Porting-Lib:${module}:${rootProject.port_lib_version}+${rootProject.minecraft_version}"
    }
    modImplementation("com.tterrag.registrate_fabric:Registrate:${rootProject.registrate_fabric_version}") {
        exclude group: "io.github.fabricators_of_create" // avoid duplicate Porting Lib
    }
    modImplementation "net.minecraftforge:forgeconfigapiport-fabric:${rootProject.forge_config_api_port_version}"
    modImplementation "com.jozufozu.flywheel:flywheel-fabric-${rootProject.minecraft_version}:${rootProject.flywheel_fabric_version}"
    modImplementation "com.jamieswhiteshirt:reach-entity-attributes:${rootProject.reach_entity_attributes_version}"
    modImplementation "io.github.tropheusj:milk-lib:${rootProject.milk_lib_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
